# Copie ce fichier en "config.ini" puis complète-le.
# Réglages par fournisseur : voir README.md

[smtp]
hote = smtp.gmail.com
port = 465
# ssl (port 465) ou starttls (port 587)
securite = ssl
utilisateur = contact@client.be
# Laisse vide pour que le mot de passe soit demandé à chaque lancement (recommandé)
mot_de_passe =

[expediteur]
nom = Nom du Client
email = contact@client.be
# Adresse qui reçoit les réponses et les demandes de désinscription (facultatif)
reponse_a =

[envoi]
# Pause entre deux e-mails : 8 s minimum conseillé pour ne pas être bloqué
pause_secondes = 8
# Gmail gratuit : 400 | Google Workspace : 1500 | Microsoft 365 : 2000 | OVH : 200 / heure
limite_par_jour = 400
# Ton adresse, pour recevoir les e-mails de test
email_test = moi@lywagency.be
# Ajoute automatiquement un lien de désinscription si le modèle n'en contient pas
ajouter_pied_desinscription = true
